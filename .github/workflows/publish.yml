name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ github.ref_name }} \
            -f target_commitish=${{ github.sha }} \
            --jq .body > release-notes.md
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Restore
        run: dotnet restore src/GraphSearchtools/GraphSearchtools.csproj && dotnet restore src/GraphSearchtools.Tests/GraphSearchtools.Tests.csproj

      - name: Build
        run: dotnet build src/GraphSearchtools/GraphSearchtools.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} --no-restore

      - name: Test
        run: dotnet test src/GraphSearchtools.Tests/GraphSearchtools.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack with release notes
        run: |
          export PackageReleaseNotes="$(cat release-notes.md)"
          dotnet pack src/GraphSearchtools/GraphSearchtools.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --no-build -o ./nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmageAI.Optimizely.GraphSearchTools.${{ steps.version.outputs.VERSION }}
          path: ./nupkg/*.nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/GraphSearchtools.Tests/TestResults/*.trx

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            2>/dev/null || echo "Release ${{ github.ref_name }} already exists; preserving existing body."
          gh release upload ${{ github.ref_name }} ./nupkg/*.nupkg --clobber
