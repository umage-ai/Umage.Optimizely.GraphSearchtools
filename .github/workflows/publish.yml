name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Resolve release notes
        run: |
          # Carve out the section in RELEASE-NOTES.md whose heading matches
          # this tag (e.g. "## v0.1.0"). The section runs until the next
          # "## " heading or EOF. The release fails if no matching section
          # is found — the curated body is the source of truth for the
          # GitHub release and the .nupkg's PackageReleaseNotes, so we'd
          # rather block the publish than silently ship without it.
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ "^## " ver "([[:space:]]|$)" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' RELEASE-NOTES.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=RELEASE-NOTES.md::No '## ${GITHUB_REF_NAME}' section found in RELEASE-NOTES.md."
            echo "Add the section, commit, delete + recreate the tag at the new commit, then re-push."
            exit 1
          fi

          echo "Using curated '## ${GITHUB_REF_NAME}' section from RELEASE-NOTES.md."
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Restore
        run: dotnet restore src/GraphSearchtools/GraphSearchtools.csproj && dotnet restore src/GraphSearchtools.Tests/GraphSearchtools.Tests.csproj

      - name: Build
        run: dotnet build src/GraphSearchtools/GraphSearchtools.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} --no-restore

      - name: Test
        run: dotnet test src/GraphSearchtools.Tests/GraphSearchtools.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack with release notes
        run: |
          export PackageReleaseNotes="$(cat release-notes.md)"
          dotnet pack src/GraphSearchtools/GraphSearchtools.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --no-build -o ./nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmageAI.Optimizely.GraphSearchTools.${{ steps.version.outputs.VERSION }}
          path: ./nupkg/*.nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/GraphSearchtools.Tests/TestResults/*.trx

      - name: Create GitHub release with nupkg attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pass the nupkg as positional args to `gh release create` so the
          # asset is uploaded atomically with the release. A separate
          # `gh release upload` step is rejected by the org's "immutable
          # releases" policy with HTTP 422. If a partial/empty release
          # already exists at this tag (e.g. from a prior failed run),
          # delete it first so we can recreate it cleanly.
          if gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; deleting before recreate."
            gh release delete ${{ github.ref_name }} --yes
          fi
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            ./nupkg/*.nupkg
